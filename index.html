<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>天文滿月 AR 影相位視角模擬器</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(13, 20, 36, 0.84);
      --panel-border: rgba(148, 163, 184, 0.22);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #fbbf24;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Noto Sans TC", sans-serif;
    }

    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    video#cameraFeed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 1;
    }

    canvas#arCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .top-bar {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .top-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      pointer-events: auto;
    }

    .pill {
      background: var(--panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .pill.active {
      background: rgba(56, 189, 248, 0.24);
      border-color: var(--accent);
      color: #e0f2fe;
    }

    .pill.warn.active {
      background: rgba(251, 191, 36, 0.24);
      border-color: var(--accent-2);
      color: #fef3c7;
    }

    .side-panel {
      position: fixed;
      top: 52px;
      left: 10px;
      width: 248px;
      max-width: calc(100vw - 20px);
      background: var(--panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 10px;
      z-index: 18;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .side-panel.hidden-panel,
    .side-panel.collapsed .panel-body {
      display: none;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .label { color: var(--muted); font-size: 11px; }
    .val {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent-2);
      font-size: 11px;
    }

    select, input[type="date"] {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 11px;
      outline: none;
      width: 100%;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      margin: 2px 0;
    }

    .btn-row { display: flex; gap: 5px; flex-wrap: wrap; }

    .btn {
      flex: 1;
      min-width: 58px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.28);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .crop-box {
      position: fixed;
      top: 52px;
      right: 10px;
      width: 132px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 6px;
      z-index: 18;
    }

    .crop-title {
      font-size: 10px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    canvas#cropCanvas {
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: 6px;
      background: #04070e;
      border: 1px solid rgba(251, 191, 36, 0.35);
      display: block;
    }

    .radar-card {
      position: fixed;
      bottom: 102px;
      right: 10px;
      width: 106px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 6px;
      z-index: 18;
    }

    canvas#radarCanvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(15,23,42,0.95) 0%, rgba(7,11,20,0.98) 100%);
      border: 1px solid rgba(148, 163, 184, 0.25);
      display: block;
      cursor: pointer;
    }

    .bottom-dock {
      position: fixed;
      bottom: 8px;
      left: 10px;
      right: 10px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 8px 12px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .telemetry-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .telemetry-item strong { color: var(--accent); }
    .telemetry-item .moon-val { color: var(--accent-2); font-weight: 700; }

    .saved-list {
      max-height: 78px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .saved-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 10px;
    }

    .saved-item button {
      background: rgba(56, 189, 248, 0.2);
      border: none;
      color: #e0f2fe;
      border-radius: 4px;
      padding: 2px 5px;
      cursor: pointer;
      font-size: 10px;
    }

    .status-toast {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid var(--accent);
      color: #e0f2fe;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      z-index: 35;
      display: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <video id="cameraFeed" autoplay playsinline muted></video>
    <canvas id="arCanvas"></canvas>
  </div>

  <div class="status-toast" id="toast"></div>

  <div class="top-bar">
    <div class="top-group">
      <button class="pill active" id="btnCamera">📷 相機</button>
      <button class="pill warn" id="btnGyro">🧭 陀螺儀</button>
      <button class="pill" id="btnGps">📍 GPS</button>
      <button class="pill active" id="btnGuideBand">🏢 5°–20°</button>
      <button class="pill" id="btnToggleSettings">👁️ 顯示設定</button>
    </div>
    <div class="top-group">
      <span class="pill" id="gpsBadge">等待 GPS · 22.382°N, 114.205°E</span>
    </div>
  </div>

  <div class="side-panel hidden-panel" id="sidePanel">
    <div class="panel-header" id="panelToggle">
      <span>🎛️ 設定</span>
      <span>▾</span>
    </div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:8px;">
      <div>
        <div class="row"><span class="label">揀滿月日子</span></div>
        <select id="fullMoonSelect" style="margin-top:3px;">
          <option value="2026-11-24">2026-11-24（海狸月）</option>
          <option value="2026-12-24">2026-12-24（寒月·超級滿月）</option>
          <option value="2027-01-22">2027-01-22（狼月）</option>
          <option value="2027-02-20">2027-02-20（雪月）</option>
          <option value="2027-03-22">2027-03-22（蟲月）</option>
          <option value="2027-04-20">2027-04-20（粉紅月）</option>
          <option value="2027-05-20">2027-05-20（花月）</option>
          <option value="2027-06-19">2027-06-19（草莓月）</option>
        </select>
        <input type="date" id="dateInput" value="2026-11-24" style="margin-top:4px;" />
      </div>

      <div>
        <div class="row">
          <span class="label">焦距（最 Wide 至 400mm）</span>
          <span class="val" id="focalVal">400 mm</span>
        </div>
        <input type="range" id="focalSlider" min="16" max="400" step="2" value="400" />
        <div class="row"><span class="label" id="wideDetectLabel">偵測最 Wide：約 16mm</span></div>
      </div>

      <div class="row">
        <span class="label">磁偏角校正（依 GPS）</span>
        <span class="val" id="declinationVal">-3.2°</span>
      </div>

      <div>
        <div class="row">
          <span class="label">機位離地高度</span>
          <span class="val" id="camAltVal">25 m</span>
        </div>
        <input type="range" id="camAltSlider" min="2" max="140" step="1" value="25" />
      </div>

      <div class="btn-row">
        <button class="btn" id="btnGoldenRise">🌅 月出低空</button>
        <button class="btn" id="btnGoldenSet">🌇 月落低空</button>
        <button class="btn" id="btnPinSpot">📌 存機位</button>
      </div>

      <div class="saved-list" id="savedList"></div>
    </div>
  </div>

  <div class="crop-box">
    <div class="crop-title">
      <span>3:2 取景框</span>
      <span id="moonShareVal">~10.3%</span>
    </div>
    <canvas id="cropCanvas" width="260" height="173"></canvas>
  </div>

  <div class="radar-card">
    <div class="crop-title">
      <span>羅盤</span>
      <span id="radarAzVal">72°</span>
    </div>
    <canvas id="radarCanvas" width="200" height="200"></canvas>
  </div>

  <div class="bottom-dock">
    <div class="telemetry-strip">
      <div class="telemetry-item">時間：<strong id="timeLabel">22:53</strong></div>
      <div class="telemetry-item">鏡頭：<strong id="camAzLabel">72.0° ENE</strong> / <strong id="camAltLabel">20.0°</strong></div>
      <div class="telemetry-item">月球：<span class="moon-val" id="moonPosLabel">Az 73.5° · Alt 69.1°</span></div>
    </div>
    <input type="range" id="timeSlider" min="0" max="1439" step="1" value="1373" />
  </div>

  <script>
    const state = {
      lat: 22.3820,
      lon: 114.2050,
      camHeightM: 25,
      minFocalMm: 16,
      focalMm: 400,
      dateStr: '2026-11-24',
      minutesOfDay: 22 * 60 + 53,
      camAz: 72,
      camPitch: 20,
      gyroEnabled: false,
      cameraEnabled: false,
      showGuideBand: true,
      settingsVisible: false,
      declination: -3.2,
      pinnedSpots: []
    };

    const arCanvas = document.getElementById('arCanvas');
    const arCtx = arCanvas.getContext('2d');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropCtx = cropCanvas.getContext('2d');
    const radarCanvas = document.getElementById('radarCanvas');
    const radarCtx = radarCanvas.getContext('2d');
    const videoEl = document.getElementById('cameraFeed');

    // Render scheduling state (dirty flag + cached daily trajectory)
    let needsRender = true;
    let rafId = null;
    let trajectoryCacheKey = '';
    let trajectoryCache = [];
    let viewW = window.innerWidth;
    let viewH = window.innerHeight;
    const lastText = Object.create(null);

    function setTextIfChanged(id, text) {
      if (lastText[id] !== text) {
        lastText[id] = text;
        document.getElementById(id).textContent = text;
      }
    }

    function markDirty() {
      needsRender = true;
      if (!rafId) {
        rafId = requestAnimationFrame(renderLoop);
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { el.style.display = 'none'; }, 2200);
    }

    const btnToggleSettings = document.getElementById('btnToggleSettings');
    const sidePanel = document.getElementById('sidePanel');
    btnToggleSettings.addEventListener('click', () => {
      state.settingsVisible = !state.settingsVisible;
      sidePanel.classList.toggle('hidden-panel', !state.settingsVisible);
      btnToggleSettings.classList.toggle('active', state.settingsVisible);
      btnToggleSettings.textContent = state.settingsVisible ? '🙈 隱藏設定' : '👁️ 顯示設定';
    });

    function estimateDeclination(lat, lon) {
      const dLat = (lat - 22.38) * 0.08;
      const dLon = (lon - 114.20) * 0.14;
      return Number((-3.2 + dLat - dLon).toFixed(1));
    }

    function getMoonPosition(dateStr, minutesOfDay, lat, lon) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const hr = Math.floor(minutesOfDay / 60);
      const mn = minutesOfDay % 60;
      const utcDate = new Date(Date.UTC(y, m - 1, d, hr - 8, mn, 0));
      const jd = utcDate.getTime() / 86400000 + 2440587.5;
      const n = jd - 2451545.0;

      const L = ((218.316 + 13.176396 * n) % 360 + 360) % 360;
      const M = ((134.963 + 13.064993 * n) % 360 + 360) % 360;
      const F = ((93.272 + 13.229350 * n) % 360 + 360) % 360;

      const rad = Math.PI / 180;
      const lonMoon = L + 6.289 * Math.sin(M * rad);
      const latMoon = 5.128 * Math.sin(F * rad);
      const obl = (23.439 - 0.0000004 * n) * rad;

      const lam = lonMoon * rad;
      const bet = latMoon * rad;

      const sinDec = Math.sin(bet) * Math.cos(obl) + Math.cos(bet) * Math.sin(obl) * Math.sin(lam);
      const dec = Math.asin(sinDec);
      const ra = Math.atan2(
        Math.sin(lam) * Math.cos(obl) - Math.tan(bet) * Math.sin(obl),
        Math.cos(lam)
      );

      const gmst = ((18.697374558 + 24.06570982441908 * n) % 24 + 24) % 24;
      const lst = ((gmst + lon / 15) % 24 + 24) % 24;
      const ha = (lst * 15 * rad) - ra;

      const latRad = lat * rad;
      const sinAlt = Math.sin(latRad) * Math.sin(dec) + Math.cos(latRad) * Math.cos(dec) * Math.cos(ha);
      const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));

      const cosAz = (Math.sin(dec) - Math.sin(latRad) * sinAlt) / (Math.cos(latRad) * Math.cos(alt) + 1e-9);
      let az = Math.acos(Math.max(-1, Math.min(1, cosAz))) / rad;
      if (Math.sin(ha) > 0) az = 360 - az;

      return {
        azimuth: ((az % 360) + 360) % 360,
        altitude: alt / rad
      };
    }

    function getCachedTrajectory() {
      const key = `${state.dateStr}|${state.lat.toFixed(3)}|${state.lon.toFixed(3)}`;
      if (key === trajectoryCacheKey) return trajectoryCache;
      const pts = [];
      for (let t = 0; t <= 1440; t += 30) {
        const pos = getMoonPosition(state.dateStr, t, state.lat, state.lon);
        if (pos.altitude >= -2) {
          pts.push({ t, az: pos.azimuth, alt: pos.altitude });
        }
      }
      trajectoryCacheKey = key;
      trajectoryCache = pts;
      return pts;
    }

    function azToCompass(az) {
      const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      return dirs[Math.round(((az % 360) + 360) % 360 / 22.5) % 16];
    }

    function formatTime(mins) {
      const m = ((mins % 1440) + 1440) % 1440;
      return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
    }

    function getHov(focalMm) {
      return (2 * Math.atan(18 / focalMm)) * (180 / Math.PI);
    }

    function angleDiff(a, b) {
      return ((a - b + 540) % 360) - 180;
    }

    function resize() {
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      arCanvas.width = viewW * dpr;
      arCanvas.height = viewH * dpr;
      arCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      markDirty();
    }
    window.addEventListener('resize', resize);
    resize();

    let isDragging = false;
    let lastX = 0, lastY = 0;

    arCanvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      const hfov = getHov(state.focalMm);
      const degPerPx = hfov / Math.max(viewW, 400);
      state.camAz = ((state.camAz - dx * degPerPx * 1.4) % 360 + 360) % 360;
      state.camPitch = Math.max(-15, Math.min(85, state.camPitch + dy * degPerPx * 1.4));
      markDirty();
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    radarCanvas.addEventListener('click', (e) => {
      const rect = radarCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      const deg = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360;
      state.camAz = Number(deg.toFixed(1));
      markDirty();
    });

    function detectWidestFocal(track) {
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : null;
        if (caps && caps.zoom && caps.zoom.min && caps.zoom.min < 1) {
          return Math.max(13, Math.round(24 * caps.zoom.min));
        }
      } catch (_) {}
      return 16;
    }

    document.getElementById('btnCamera').addEventListener('click', async () => {
      const btn = document.getElementById('btnCamera');
      if (!state.cameraEnabled) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          videoEl.srcObject = stream;
          videoEl.style.display = 'block';
          state.cameraEnabled = true;
          btn.classList.add('active');

          const track = stream.getVideoTracks()[0];
          const widest = detectWidestFocal(track);
          state.minFocalMm = widest;
          const slider = document.getElementById('focalSlider');
          slider.min = widest;
          if (state.focalMm < widest) state.focalMm = widest;
          slider.value = state.focalMm;
          setTextIfChanged('focalVal', `${state.focalMm} mm`);
          setTextIfChanged('wideDetectLabel', `偵測最 Wide：約 ${widest}mm`);
          showToast(`已開相機（最 Wide 約 ${widest}mm）`);
        } catch (err) {
          showToast('無法開啟相機，已用模擬畫面');
        }
      } else {
        if (videoEl.srcObject) {
          videoEl.srcObject.getTracks().forEach(t => t.stop());
          videoEl.srcObject = null;
        }
        videoEl.style.display = 'none';
        state.cameraEnabled = false;
        btn.classList.remove('active');
      }
      markDirty();
    });

    let gyroPending = false;
    document.getElementById('btnGyro').addEventListener('click', async () => {
      const btn = document.getElementById('btnGyro');
      if (state.gyroEnabled) {
        state.gyroEnabled = false;
        btn.classList.remove('active');
        return;
      }
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== 'granted') {
            showToast('未獲陀螺儀權限');
            return;
          }
        }
        window.addEventListener('deviceorientation', handleOrientation, { passive: true });
        state.gyroEnabled = true;
        btn.classList.add('active');
        showToast('已啟用陀螺儀＋磁偏角修正');
      } catch (e) {
        showToast('需 HTTPS 或裝置不支援');
      }
    });

    function handleOrientation(e) {
      if (!state.gyroEnabled) return;
      let heading = null;
      if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
        heading = e.webkitCompassHeading;
      } else if (typeof e.alpha === 'number' && !isNaN(e.alpha)) {
        heading = (360 - e.alpha) % 360;
      }
      let changed = false;
      if (heading !== null) {
        const nextAz = ((heading + state.declination) % 360 + 360) % 360;
        if (Math.abs(nextAz - state.camAz) >= 0.25) {
          state.camAz = nextAz;
          changed = true;
        }
      }
      if (typeof e.beta === 'number' && !isNaN(e.beta)) {
        const nextPitch = Math.max(-15, Math.min(85, e.beta - 75));
        if (Math.abs(nextPitch - state.camPitch) >= 0.25) {
          state.camPitch = nextPitch;
          changed = true;
        }
      }
      if (changed && !gyroPending) {
        gyroPending = true;
        requestAnimationFrame(() => {
          gyroPending = false;
          markDirty();
        });
      }
    }

    function requestCurrentGps(silent) {
      if (!navigator.geolocation) {
        if (!silent) showToast('瀏覽器不支援 GPS');
        return;
      }
      if (!silent) showToast('更新 GPS 位置中...');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.lat = Number(pos.coords.latitude.toFixed(4));
          state.lon = Number(pos.coords.longitude.toFixed(4));
          state.declination = estimateDeclination(state.lat, state.lon);
          setTextIfChanged('gpsBadge', `GPS · ${state.lat}°N, ${state.lon}°E`);
          setTextIfChanged('declinationVal', `${state.declination > 0 ? '+' : ''}${state.declination}°`);
          document.getElementById('btnGps').classList.add('active');
          if (!silent) showToast(`已更新 GPS（磁偏角 ${state.declination}°）`);
          markDirty();
        },
        () => {
          if (!silent) showToast('未能取得 GPS，請檢查定位權限');
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    document.getElementById('btnGps').addEventListener('click', () => requestCurrentGps(false));
    requestCurrentGps(true);

    document.getElementById('btnGuideBand').addEventListener('click', (e) => {
      state.showGuideBand = !state.showGuideBand;
      e.currentTarget.classList.toggle('active', state.showGuideBand);
      markDirty();
    });

    document.getElementById('panelToggle').addEventListener('click', () => {
      document.getElementById('sidePanel').classList.toggle('collapsed');
    });

    document.getElementById('fullMoonSelect').addEventListener('change', (e) => {
      state.dateStr = e.target.value;
      document.getElementById('dateInput').value = e.target.value;
      showToast(`已選滿月日：${e.target.value}`);
      markDirty();
    });

    document.getElementById('dateInput').addEventListener('change', (e) => {
      if (e.target.value) {
        state.dateStr = e.target.value;
        markDirty();
      }
    });

    document.getElementById('focalSlider').addEventListener('input', (e) => {
      state.focalMm = parseInt(e.target.value, 10);
      setTextIfChanged('focalVal', `${state.focalMm} mm`);
      markDirty();
    });

    document.getElementById('camAltSlider').addEventListener('input', (e) => {
      state.camHeightM = parseInt(e.target.value, 10);
      setTextIfChanged('camAltVal', `${state.camHeightM} m`);
      markDirty();
    });

    document.getElementById('timeSlider').addEventListener('input', (e) => {
      state.minutesOfDay = parseInt(e.target.value, 10);
      markDirty();
    });

    function findGoldenAltitude(targetAlt) {
      let bestMin = state.minutesOfDay;
      let bestDiff = 999;
      for (let t = 0; t < 1440; t += 5) {
        const pos = getMoonPosition(state.dateStr, t, state.lat, state.lon);
        const diff = Math.abs(pos.altitude - targetAlt);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestMin = t;
        }
      }
      state.minutesOfDay = bestMin;
      document.getElementById('timeSlider').value = bestMin;
      const pos = getMoonPosition(state.dateStr, bestMin, state.lat, state.lon);
      state.camAz = Number(pos.azimuth.toFixed(1));
      state.camPitch = Math.max(2, Math.min(30, Number(pos.altitude.toFixed(1))));
      showToast(`${formatTime(bestMin)} · 約 ${pos.altitude.toFixed(1)}°`);
      markDirty();
    }

    document.getElementById('btnGoldenRise').addEventListener('click', () => findGoldenAltitude(10));
    document.getElementById('btnGoldenSet').addEventListener('click', () => findGoldenAltitude(8));

    function loadSpots() {
      try {
        state.pinnedSpots = JSON.parse(localStorage.getItem('moon_ar_spots_v1') || '[]');
      } catch (_) {
        state.pinnedSpots = [];
      }
      renderSpots();
    }

    function saveSpots() {
      try {
        localStorage.setItem('moon_ar_spots_v1', JSON.stringify(state.pinnedSpots));
      } catch (_) {}
      renderSpots();
    }

    function renderSpots() {
      const box = document.getElementById('savedList');
      if (!state.pinnedSpots.length) {
        box.innerHTML = '<div class="label">未有儲存機位</div>';
        return;
      }
      box.innerHTML = state.pinnedSpots.map((s, idx) => `
        <div class="saved-item">
          <span>${s.date} ${formatTime(s.mins)} · ${s.focal}mm</span>
          <span>
            <button onclick="applySpot(${idx})">載入</button>
            <button onclick="deleteSpot(${idx})">刪</button>
          </span>
        </div>
      `).join('');
    }

    window.applySpot = function(idx) {
      const s = state.pinnedSpots[idx];
      if (!s) return;
      state.lat = s.lat;
      state.lon = s.lon;
      state.camHeightM = s.camHeightM;
      state.dateStr = s.date;
      state.minutesOfDay = s.mins;
      state.camAz = s.az;
      state.camPitch = s.pitch;
      state.focalMm = s.focal;
      document.getElementById('dateInput').value = s.date;
      document.getElementById('timeSlider').value = s.mins;
      document.getElementById('focalSlider').value = s.focal;
      setTextIfChanged('focalVal', `${s.focal} mm`);
      showToast('已載入機位');
      markDirty();
    };

    window.deleteSpot = function(idx) {
      state.pinnedSpots.splice(idx, 1);
      saveSpots();
    };

    document.getElementById('btnPinSpot').addEventListener('click', () => {
      state.pinnedSpots.unshift({
        lat: state.lat,
        lon: state.lon,
        camHeightM: state.camHeightM,
        date: state.dateStr,
        mins: state.minutesOfDay,
        az: Number(state.camAz.toFixed(1)),
        pitch: Number(state.camPitch.toFixed(1)),
        focal: state.focalMm
      });
      state.pinnedSpots = state.pinnedSpots.slice(0, 12);
      saveSpots();
      showToast('已儲存機位');
    });

    loadSpots();

    function draw() {
      const w = viewW;
      const h = viewH;
      const hfov = getHov(state.focalMm);
      const vfov = hfov * (h / Math.max(w, 1));

      if (!state.cameraEnabled) {
        const grad = arCtx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#050914');
        grad.addColorStop(0.65, '#0c172b');
        grad.addColorStop(1, '#141b29');
        arCtx.fillStyle = grad;
        arCtx.fillRect(0, 0, w, h);

        const horizonY = h * 0.5 + (state.camPitch / vfov) * h;
        const heightOffset = (state.camHeightM - 25) * 0.65;

        arCtx.beginPath();
        arCtx.moveTo(0, h);
        for (let sx = 0; sx <= w; sx += 32) {
          const azAtX = state.camAz + ((sx / w) - 0.5) * hfov;
          const ridgeAlt = 6 + 5 * Math.sin(azAtX * 0.12) + 2.5 * Math.cos(azAtX * 0.29);
          const sy = horizonY - ((ridgeAlt - state.camPitch) / vfov) * h + heightOffset * 0.25;
          arCtx.lineTo(sx, sy);
        }
        arCtx.lineTo(w, h);
        arCtx.closePath();
        arCtx.fillStyle = 'rgba(15, 23, 42, 0.92)';
        arCtx.fill();

        arCtx.fillStyle = 'rgba(20, 30, 48, 0.95)';
        for (let sx = 0; sx < w; sx += 80) {
          const azAtX = state.camAz + ((sx / w) - 0.5) * hfov;
          const bldgTopAlt = 8 + 9 * Math.abs(Math.sin(azAtX * 0.23 + 1.1));
          const topY = horizonY - ((bldgTopAlt - state.camPitch) / vfov) * h + heightOffset * 0.5;
          arCtx.fillRect(sx + 4, topY, 72, h - topY);
        }
      } else {
        arCtx.clearRect(0, 0, w, h);
      }

      const degToScreenX = (az) => w * 0.5 + (angleDiff(az, state.camAz) / hfov) * w;
      const altToScreenY = (alt) => h * 0.5 - ((alt - state.camPitch) / vfov) * h;

      if (state.showGuideBand) {
        const y20 = altToScreenY(20);
        const y5 = altToScreenY(5);
        arCtx.fillStyle = 'rgba(56, 189, 248, 0.08)';
        arCtx.fillRect(0, Math.min(y20, y5), w, Math.abs(y5 - y20));
        arCtx.setLineDash([6, 6]);
        arCtx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        arCtx.lineWidth = 1.2;
        arCtx.beginPath();
        arCtx.moveTo(0, y20); arCtx.lineTo(w, y20);
        arCtx.moveTo(0, y5); arCtx.lineTo(w, y5);
        arCtx.stroke();
        arCtx.setLineDash([]);
      }

      const rawPts = getCachedTrajectory();
      if (rawPts.length > 1) {
        arCtx.beginPath();
        rawPts.forEach((p, idx) => {
          const x = degToScreenX(p.az);
          const y = altToScreenY(p.alt);
          if (idx === 0) arCtx.moveTo(x, y);
          else arCtx.lineTo(x, y);
        });
        arCtx.strokeStyle = 'rgba(251, 191, 36, 0.85)';
        arCtx.lineWidth = 3;
        arCtx.stroke();

        arCtx.font = 'bold 11px sans-serif';
        for (let i = 0; i < rawPts.length; i++) {
          const p = rawPts[i];
          const x = degToScreenX(p.az);
          const y = altToScreenY(p.alt);
          if (x < -40 || x > w + 40 || y < -30 || y > h + 30) continue;

          arCtx.beginPath();
          arCtx.arc(x, y, 6.5, 0, Math.PI * 2);
          arCtx.fillStyle = '#fde047';
          arCtx.fill();
          arCtx.lineWidth = 1.5;
          arCtx.strokeStyle = '#78350f';
          arCtx.stroke();

          if (Math.abs(angleDiff(p.az, state.camAz)) < hfov * 0.6) {
            const tag = `${formatTime(p.t)} · ${Math.round(p.alt)}°`;
            const tw = arCtx.measureText(tag).width + 8;
            arCtx.fillStyle = 'rgba(7, 11, 20, 0.78)';
            arCtx.fillRect(x + 10, y - 16, tw, 16);
            arCtx.fillStyle = '#fef08a';
            arCtx.fillText(tag, x + 14, y - 4);
          }
        }
      }

      const moon = getMoonPosition(state.dateStr, state.minutesOfDay, state.lat, state.lon);
      const moonAngDiam = 0.53;
      const moonRadiusPx = Math.max(7, (moonAngDiam / hfov) * w * 0.5);
      const mx = degToScreenX(moon.azimuth);
      const my = altToScreenY(moon.altitude);

      const glow = arCtx.createRadialGradient(mx, my, moonRadiusPx * 0.2, mx, my, moonRadiusPx * 3.8);
      glow.addColorStop(0, 'rgba(254, 240, 138, 0.85)');
      glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
      arCtx.fillStyle = glow;
      arCtx.beginPath();
      arCtx.arc(mx, my, moonRadiusPx * 3.8, 0, Math.PI * 2);
      arCtx.fill();

      arCtx.beginPath();
      arCtx.arc(mx, my, moonRadiusPx, 0, Math.PI * 2);
      arCtx.fillStyle = moon.altitude < 12 ? '#fdba74' : '#fef9c3';
      arCtx.fill();

      const cropW = Math.min(w * 0.72, 400);
      const cropH = cropW * (2 / 3);
      arCtx.strokeStyle = 'rgba(251, 191, 36, 0.55)';
      arCtx.lineWidth = 1.5;
      arCtx.strokeRect((w - cropW) / 2, (h - cropH) / 2, cropW, cropH);

      setTextIfChanged('timeLabel', formatTime(state.minutesOfDay));
      setTextIfChanged('camAzLabel', `${state.camAz.toFixed(1)}° ${azToCompass(state.camAz)}`);
      setTextIfChanged('camAltLabel', `${state.camPitch.toFixed(1)}°`);
      setTextIfChanged('moonPosLabel', `Az ${moon.azimuth.toFixed(1)}° · Alt ${moon.altitude.toFixed(1)}°`);

      const cw = cropCanvas.width, ch = cropCanvas.height;
      cropCtx.clearRect(0, 0, cw, ch);
      cropCtx.fillStyle = '#060b16';
      cropCtx.fillRect(0, 0, cw, ch);

      const cropHfov = getHov(state.focalMm);
      const cropVfov = cropHfov * (2 / 3);
      setTextIfChanged('moonShareVal', `~${((moonAngDiam / cropHfov) * 100).toFixed(1)}%`);

      const cmx = cw * 0.5 + (angleDiff(moon.azimuth, state.camAz) / cropHfov) * cw;
      const cmy = ch * 0.5 - ((moon.altitude - state.camPitch) / cropVfov) * ch;
      const cmr = Math.max(2.5, (moonAngDiam / cropHfov) * cw * 0.5);

      cropCtx.beginPath();
      cropCtx.arc(cmx, cmy, cmr, 0, Math.PI * 2);
      cropCtx.fillStyle = '#fef08a';
      cropCtx.fill();

      const rw = radarCanvas.width, rh = radarCanvas.height;
      const rcx = rw / 2, rcy = rh / 2, radMax = rw * 0.44;
      radarCtx.clearRect(0, 0, rw, rh);
      setTextIfChanged('radarAzVal', `${Math.round(state.camAz)}°`);

      radarCtx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
      radarCtx.beginPath();
      radarCtx.arc(rcx, rcy, radMax, 0, Math.PI * 2);
      radarCtx.stroke();

      const mDist = Math.max(0.12, Math.min(1, (90 - Math.max(0, moon.altitude)) / 90)) * radMax;
      const mRad = (moon.azimuth - 90) * Math.PI / 180;
      radarCtx.beginPath();
      radarCtx.arc(rcx + Math.cos(mRad) * mDist, rcy + Math.sin(mRad) * mDist, 5, 0, Math.PI * 2);
      radarCtx.fillStyle = '#fbbf24';
      radarCtx.fill();

      const cRad = (state.camAz - 90) * Math.PI / 180;
      radarCtx.beginPath();
      radarCtx.moveTo(rcx, rcy);
      radarCtx.lineTo(rcx + Math.cos(cRad) * radMax, rcy + Math.sin(cRad) * radMax);
      radarCtx.strokeStyle = '#38bdf8';
      radarCtx.lineWidth = 2.5;
      radarCtx.stroke();
    }

    function renderLoop() {
      rafId = null;
      if (!needsRender) return;
      needsRender = false;
      draw();
    }

    markDirty();
  </script>
</body>
</html>
